<!DOCTYPE html>

<head>

  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link rel="manifest" href="img/site.webmanifest">
  
  <!-- CDNs for Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Marked.js (Markdown parsing) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<body>

  <!-- Reading Progress Bar (Visible only on Article Reader) -->
  <div class="reading-progress-container">
    <div class="reading-progress-bar" id="reading-progress"></div>
  </div>

    <div class="brand-section" style="margin-bottom: 0;">

      <div class="brand-title">swapnillens.in</div>
    </div>
    <div class="profile-quick">
      <div class="profile-avatar">SK</div>
    </div>
  </header>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar-drawer">
      <div class="brand-section">
        <div class="brand-logo">S</div>
        <div class="brand-title">swapnillens.in</div>
      </div>
      
      <nav style="flex-grow: 1;">
        <ul class="nav-menu">
          <li><a href="#home" class="nav-item-link" data-route="home"><i class="fas fa-home"></i> Home</a></li>
          <li><a href="#projects" class="nav-item-link" data-route="projects"><i class="fas fa-project-diagram"></i> Projects</a></li>

          <li><a href="#contact" class="nav-item-link" data-route="contact"><i class="fas fa-paper-plane"></i> Contact</a></li>
        </ul>
      </nav>
      
      <div class="sidebar-footer">
        <p>&copy; 2026 Swapnil Kumar</p>
        <p style="margin-top: 0.25rem; font-size: 0.7rem;"><a href="#privacy" style="color: var(--text-muted); text-decoration: underline;">Privacy Policy</a></p>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="top-bar">
        <div class="search-container">
          <i class="fas fa-search search-icon"></i>
          <input type="text" class="search-input" id="global-search" placeholder="Type / to search projects, agents or anime...">

        <div class="profile-quick">
          <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">Swapnil Kumar</span>
          <div class="profile-avatar">SK</div>
        </div>
      </div>

      <!-- Active View Content Container -->
      <section class="view-section" id="app-view">
        <!-- Rendered dynamically by app.js -->
        <div style="display: flex; justify-content: center; align-items: center; height: 300px;">
          <p style="color: var(--text-muted);"><i class="fas fa-spinner fa-spin fa-2x"></i> Loading application...</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Bottom Navigation Bar (Visible only on mobile) -->
  <nav class="bottom-nav" id="mobile-bottom-nav">
    <a href="#home" class="bottom-nav-item" data-route="home">
      <i class="fas fa-home"></i>

    </a>
    <a href="#projects" class="bottom-nav-item" data-route="projects">

    </button>

  <!-- Fullscreen More Menu Overlay for mobile -->
  <div class="mobile-more-overlay" id="mobile-more-overlay">
    <div class="overlay-header">
      <span class="overlay-title">Navigation</span>
      <button class="overlay-close" id="overlay-close-btn" aria-label="Close Menu"><i class="fas fa-times"></i></button>
    </div>
    <ul class="overlay-menu">
      <li><a href="#contact" class="overlay-link"><i class="fas fa-paper-plane"></i> Contact</a></li>

  <button class="back-to-top" id="back-to-top-btn" aria-label="Scroll Back to Top">

  <script src="js/app.js"></script>
